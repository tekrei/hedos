# Crossover Types
GA.Crossover.SinglePoint=Single Point Crossover
GA.Crossover.SinglePoint.Tooltip=Splits parent chromosomes at a single point and exchanges segments.
GA.Crossover.TwoPoint=Two Point Crossover
GA.Crossover.TwoPoint.Tooltip=Swaps two segments between parents to produce offspring.
GA.Crossover.Uniform=Uniform Crossover
GA.Crossover.Uniform.Tooltip=Randomly selects genes from each parent with equal probability.
GA.Crossover.Ordered=Ordered Crossover
GA.Crossover.Ordered.Tooltip=Preserves relative order of genes while inheriting from both parents.
GA.Crossover.VectorizedUniform=Vectorized Uniform Crossover
GA.Crossover.VectorizedUniform.Tooltip=High-performance uniform crossover utilizing SIMD instructions.
GA.Crossover.PMX=Partially Mapped Crossover
GA.Crossover.PMX.Tooltip=Maintains absolute gene positions while ensuring valid permutations.
GA.Crossover.Cycle=Cycle Crossover
GA.Crossover.Cycle.Tooltip=Ensures genes in the offspring come from the same position in a parent.
GA.Crossover.ERX=Edge Recombination Crossover
GA.Crossover.ERX.Tooltip=Focuses on preserving edge adjacencies, highly efficient for TSP.

# Mutation Types
GA.Mutation.Random=Random Mutation
GA.Mutation.Random.Tooltip=Randomly alters genes in the chromosome to introduce diversity.
GA.Mutation.OnlyImprovingRandom=Only Improving Random Mutation
GA.Mutation.OnlyImprovingRandom.Tooltip=Applies random mutations only if they result in an improved solution.
GA.Mutation.OnlyImprovingSystematic=Only Improving Systematic Mutation
GA.Mutation.OnlyImprovingSystematic.Tooltip=Explores mutations systematically and only applies those that improve fitness.
GA.Mutation.VectorizedScramble=Vectorized Scramble Mutation
GA.Mutation.VectorizedScramble.Tooltip=SIMD-accelerated reordering of gene subsets.
GA.Mutation.Inversion=Inversion Mutation
GA.Mutation.Inversion.Tooltip=Reverses a randomly selected subset of genes to improve path crossings.
GA.Mutation.Displacement=Displacement Mutation
GA.Mutation.Displacement.Tooltip=Extracts a sub-tour and re-inserts it at a random position.

# Selection Types
GA.Selection.Tournament=Tournament Selection
GA.Selection.Tournament.Tooltip=Chooses the best out of a random group of individuals.
GA.Selection.RouletteWheel=Roulette Wheel Selection
GA.Selection.RouletteWheel.Tooltip=Selects individuals probabilistically based on fitness proportion.
GA.Selection.SUS=Stochastic Universal Sampling
GA.Selection.SUS.Tooltip=Uses evenly spaced pointers for a single-pass representative sampling.

# Stagnation Types
GA.Stagnation.Simple=Simple Stagnation
GA.Stagnation.Simple.Tooltip=Linearly increases the neighborhood search size when progress plateaus.
GA.Stagnation.Annealing=Annealing Stagnation
GA.Stagnation.Annealing.Tooltip=Uses a temperature-based increment to escape deep local optima.

# Elitism Types
GA.Elitism.None=None
GA.Elitism.None.Tooltip=No elitism applied; the best solution can be lost across generations.
GA.Elitism.Default=Default Elitism
GA.Elitism.Default.Tooltip=Guarantees the best individual from the current population survives.

# Local Optimization Types
GA.LocalOpt.None=None
GA.LocalOpt.None.Tooltip=Standard Genetic Algorithm without local search refinement.
GA.LocalOpt.2Opt=2-Opt
GA.LocalOpt.2Opt.Tooltip=Iteratively removes edge crossings by swapping pairs of edges (First Improvement).
GA.LocalOpt.Best2Opt=Best 2-Opt
GA.LocalOpt.Best2Opt.Tooltip=Scans all possible swaps and selects the one with the highest gain.
GA.LocalOpt.3Opt=3-Opt
GA.LocalOpt.3Opt.Tooltip=Explores triplet edge removals to find improvements (First Improvement).
GA.LocalOpt.Best3Opt=Best 3-Opt
GA.LocalOpt.Best3Opt.Tooltip=SIMD-accelerated scan for the best 3-edge reconnection.
GA.LocalOpt.Limited3Opt=Limited 3-Opt
GA.LocalOpt.Limited3Opt.Tooltip=Optimized 3-opt that only checks the nearest neighbors.
GA.LocalOpt.Partitioned2Opt=Partitioned 2-Opt
GA.LocalOpt.Partitioned2Opt.Tooltip=Divides the tour into segments for parallel 2-opt refinement.
GA.LocalOpt.Partitioned3Opt=Partitioned 3-Opt
GA.LocalOpt.Partitioned3Opt.Tooltip=Divides the tour into segments for parallel 3-opt refinement.
GA.LocalOpt.LinKernighan=Lin-Kernighan
GA.LocalOpt.LinKernighan.Tooltip=Variable-depth refinement considered the gold standard for TSP.
GA.LocalOpt.MultiStartLK=Multi-Start Lin-Kernighan
GA.LocalOpt.MultiStartLK.Tooltip=Runs multiple LK instances in parallel from random starting points.

# Tooltips
SidePanel.CrossoverProbability.Tooltip=Probability of two parents exchanging genetic material.
SidePanel.MutationProbability.Tooltip=Probability of a gene randomly changing.
SidePanel.TurnPenalty.Tooltip=Penalty applied for sharp turns in the tour.